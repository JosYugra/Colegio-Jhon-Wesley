<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lector de revistas — Colegio Cristiano John Wesley</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="https://jwesley.edu.pe/wp-content/uploads/2025/11/cropped-banner-de-colegio-1-32x32.png" sizes="32x32">
    <link rel="preconnect" href="https://jwesley.edu.pe">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/lector.css?v=20260825-2">
</head>
<body class="book-reader-body">
    <header class="book-reader-header">
        <a class="book-reader-back" href="revistas.html" aria-label="Volver a revistas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            <span>Revistas</span>
        </a>
        <div class="book-reader-heading">
            <a class="book-reader-school-logo" href="../index.html" aria-label="Ir al inicio del Colegio Cristiano John Wesley">
                <img
                    src="https://jwesley.edu.pe/wp-content/uploads/2025/11/banner-de-colegio-1.png"
                    alt="Colegio Cristiano John Wesley"
                    width="116"
                    height="46"
                >
            </a>
            <div class="book-reader-title-block">
                <span>Revista institucional</span>
                <h1 id="readerTitle">El Atrio</h1>
            </div>
        </div>
        <div class="book-reader-tools">
            <button type="button" id="zoomOut" aria-label="Reducir zoom" title="Reducir zoom">−</button>
            <button type="button" id="fitPage" aria-label="Ajustar página" title="Ajustar página">Ajustar</button>
            <button type="button" id="zoomIn" aria-label="Aumentar zoom" title="Aumentar zoom">+</button>
            <button type="button" id="fullscreen" aria-label="Pantalla completa" title="Pantalla completa">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m18 0v5h-5"/></svg>
            </button>
        </div>
    </header>

    <main class="book-reader-main" id="readerMain">
        <section class="book-loading" id="readerLoading" aria-live="polite">
            <div class="loading-book" aria-hidden="true"><i></i><i></i></div>
            <h2>Preparando revista...</h2>
            <p id="loadingDetail">Descargando el documento</p>
        </section>

        <section class="book-error" id="readerError" hidden>
            <span aria-hidden="true">!</span>
            <h2>No pudimos cargar esta revista.</h2>
            <p id="readerErrorDetail">Comprueba tu conexión e inténtalo nuevamente.</p>
            <div>
                <button type="button" id="retryButton">Reintentar</button>
                <a href="revistas.html">Volver a revistas</a>
            </div>
        </section>

        <section class="book-stage" id="bookStage" aria-label="Lector de revista" hidden>
            <div class="book" id="book">
                <div class="book-page book-page-left" id="leftPage" hidden>
                    <canvas id="leftCanvas"></canvas>
                    <span class="page-number" id="leftNumber"></span>
                </div>
                <div class="book-page book-page-right" id="rightPage">
                    <canvas id="rightCanvas"></canvas>
                    <span class="page-number" id="rightNumber"></span>
                </div>
                <div class="book-spine" aria-hidden="true"></div>
            </div>
        </section>
    </main>

    <footer class="book-navigation" id="bookNavigation" hidden>
        <button class="nav-page-button" type="button" id="previousPage">
            <span aria-hidden="true">‹</span><span>Anterior</span>
        </button>
        <label class="page-selector" for="pageInput" aria-live="polite">
            <span>Página</span>
            <input id="pageInput" type="text" inputmode="numeric" pattern="[0-9]*" value="1" aria-label="Número de página">
            <span>de <strong id="totalPages">—</strong></span>
        </label>
        <button class="nav-page-button" type="button" id="nextPage">
            <span>Siguiente</span><span aria-hidden="true">›</span>
        </button>
    </footer>

    <script src="../js/revistas-catalog.js?v=20260825-3" defer></script>
    <script src="../js/revistas-data.js?v=20260825-3" defer></script>
    <script src="../js/lector.js?v=20260825-6" defer></script>
</body>
</html>
